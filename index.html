<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语学习类型测试 - 可直接复制到微信公众号</title>
  <style>
    /* 预览页面样式 */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .preview-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }
    
    .title {
      text-align: center;
      color: #333;
      font-size: 24px;
      margin: 20px 0;
    }
    
    .tip {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
      font-size: 14px;
      color: #856404;
    }
    
    .copy-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      display: block;
      margin: 30px auto;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .copy-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="preview-container" id="previewContainer">
    <!-- 这里是测试工具的主体，复制时会只复制这部分 -->
    <div id="testContent">
      <!-- 关键：在SVG前面先定义JavaScript函数 -->
      <script>
        // 确保所有函数都在全局作用域
        function showPage(pageId) {
          // 隐藏所有页面
          var pages = ['page-cover', 'page-1', 'page-2', 'page-3', 'page-4', 'page-5', 'page-result'];
          for(var i = 0; i < pages.length; i++) {
            var el = document.getElementById(pages[i]);
            if(el) el.style.display = 'none';
          }
          
          // 显示目标页面
          var target = document.getElementById(pageId);
          if(target) target.style.display = 'block';
        }
        
        function selectOption(questionNum, optionNum) {
          // 保存答案到全局变量
          if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
          window.userAnswers[questionNum-1] = optionNum;
          
          // 清除该问题的所有选项选中状态
          for(var i = 1; i <= 3; i++) {
            var rect = document.querySelector('#q' + questionNum + '-option' + i + ' rect:first-of-type');
            var text = document.querySelector('#q' + questionNum + '-option' + i + ' text');
            
            if(rect) {
              rect.classList.remove('option-rect-selected');
              rect.classList.add('option-rect');
            }
            if(text) text.classList.remove('option-selected');
          }
          
          // 设置当前选项为选中状态
          var selectedRect = document.querySelector('#q' + questionNum + '-option' + optionNum + ' rect:first-of-type');
          var selectedText = document.querySelector('#q' + questionNum + '-option' + optionNum + ' text');
          
          if(selectedRect) {
            selectedRect.classList.remove('option-rect');
            selectedRect.classList.add('option-rect-selected');
          }
          if(selectedText) selectedText.classList.add('option-selected');
          
          // 激活下一题按钮
          if(questionNum < 5) {
            var nextBtn = document.getElementById('next-btn-' + questionNum);
            if(nextBtn) {
              nextBtn.classList.remove('next-btn');
              nextBtn.classList.add('next-btn-active');
            }
          } else {
            // 第5题，激活查看结果按钮
            var resultBtn = document.getElementById('result-btn');
            if(resultBtn) {
              resultBtn.classList.remove('next-btn');
              resultBtn.classList.add('next-btn-active');
            }
          }
        }
        
        function nextQuestion(nextPageNum) {
          // 检查当前问题是否已回答
          if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
          var currentPage = nextPageNum - 1;
          
          if(window.userAnswers[currentPage-1] === 0) {
            alert('请先选择一个选项！');
            return;
          }
          
          showPage('page-' + nextPageNum);
        }
        
        function showResult() {
          // 检查第5题是否已回答
          if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
          if(window.userAnswers[4] === 0) {
            alert('请先选择一个选项！');
            return;
          }
          
          // 计算结果类型
          calculateResult();
          showPage('page-result');
        }
        
        function calculateResult() {
          if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
          
          // 统计各选项数量
          var typeACount = 0;
          var typeBCount = 0;
          var typeCCount = 0;
          
          for(var i = 0; i < 5; i++) {
            var answer = window.userAnswers[i];
            if(answer === 1) typeACount++;
            else if(answer === 2) typeBCount++;
            else if(answer === 3) typeCCount++;
          }
          
          // 确定类型
          var resultType = "逻辑型学习者";
          var resultSubtitle = "擅长通过理解规则和结构来学习";
          var resultResource = "推荐学习资源：《剑桥语法》、《新概念英语》";
          
          if(typeBCount > typeACount && typeBCount > typeCCount) {
            resultType = "直觉型学习者";
            resultSubtitle = "擅长通过语感和直觉来学习";
            resultResource = "推荐学习资源：TED演讲、英文电影、有声书";
          } else if(typeCCount > typeACount && typeCCount > typeBCount) {
            resultType = "实践型学习者";
            resultSubtitle = "擅长通过实际应用来学习";
            resultResource = "推荐学习资源：语言交换平台、口语课程";
          }
          
          // 更新结果页
          var resultTypeEl = document.getElementById('result-type');
          var resultSubtitleEl = document.getElementById('result-subtitle');
          var resultResourceEl = document.getElementById('result-resource');
          
          if(resultTypeEl) resultTypeEl.textContent = resultType;
          if(resultSubtitleEl) resultSubtitleEl.textContent = resultSubtitle;
          if(resultResourceEl) resultResourceEl.textContent = resultResource;
        }
        
        function restartTest() {
          // 重置答案
          window.userAnswers = [0, 0, 0, 0, 0];
          
          // 重置所有选项状态
          for(var q = 1; q <= 5; q++) {
            for(var o = 1; o <= 3; o++) {
              var rect = document.querySelector('#q' + q + '-option' + o + ' rect:first-of-type');
              var text = document.querySelector('#q' + q + '-option' + o + ' text');
              
              if(rect) {
                rect.classList.remove('option-rect-selected');
                rect.classList.add('option-rect');
              }
              if(text) text.classList.remove('option-selected');
            }
          }
          
          // 重置所有按钮
          for(var i = 1; i <= 4; i++) {
            var btn = document.getElementById('next-btn-' + i);
            if(btn) {
              btn.classList.remove('next-btn-active');
              btn.classList.add('next-btn');
            }
          }
          
          var resultBtn = document.getElementById('result-btn');
          if(resultBtn) {
            resultBtn.classList.remove('next-btn-active');
            resultBtn.classList.add('next-btn');
          }
          
          // 回到封面
          showPage('page-cover');
        }
        
        // 页面加载完成后初始化
        window.onload = function() {
          showPage('page-cover');
        };
      </script>
      
      <svg viewBox="0 0 750 2400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <!-- 样式定义 -->
        <style>
          .title { font-family: "PingFang SC", sans-serif; font-weight: bold; fill: #FF8B2C; font-size: 64px; }
          .subtitle { font-family: "PingFang SC", sans-serif; fill: #666; font-size: 28px; }
          .question { font-family: "PingFang SC", sans-serif; font-size: 36px; fill: #333; font-weight: 500; }
          .option { font-family: "PingFang SC", sans-serif; font-size: 28px; fill: #666; }
          .option-selected { fill: #ffffff; }
          .button { font-family: "PingFang SC", sans-serif; font-size: 36px; font-weight: bold; fill: #ffffff; }
          .progress-text { font-family: "PingFang SC", sans-serif; font-size: 24px; fill: #999; }
          .result-title { font-family: "PingFang SC", sans-serif; font-size: 48px; font-weight: bold; fill: #FF8B2C; }
          .result-desc { font-family: "PingFang SC", sans-serif; font-size: 28px; fill: #666; line-height: 1.5; }
          .option-rect { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 2; }
          .option-rect-selected { fill: #FF8B2C; stroke: #FF8B2C; }
          .next-btn { fill: #e0e0e0; }
          .next-btn-active { fill: #FF8B2C; }
        </style>
        
        <!-- 白色背景 -->
        <rect width="750" height="2400" fill="#ffffff"/>
        
        <!-- 封面页 -->
        <g id="page-cover">
          <text x="375" y="300" text-anchor="middle" class="title">英语学习类型自测</text>
          <text x="375" y="380" text-anchor="middle" class="subtitle">基于《最强大脑》学习方法论</text>
          
          <text x="375" y="600" text-anchor="middle" class="question">你属于哪种英语学习者？</text>
          <text x="375" y="680" text-anchor="middle" class="subtitle">通过5个问题，找到最适合你的学习路径</text>
          
          <!-- 开始按钮 -->
          <rect x="175" y="800" width="400" height="80" rx="40" fill="#FF8B2C">
            <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
          </rect>
          <text x="375" y="852" text-anchor="middle" class="button">开始测试</text>
          
          <!-- 关键：使用rect包裹点击区域，而不是a标签 -->
          <rect x="175" y="800" width="400" height="80" rx="40" fill="transparent" 
                onclick="showPage('page-1')" style="cursor: pointer;"/>
        </g>
        
        <!-- 问题1 -->
        <g id="page-1" style="display: none;">
          <!-- 进度条 -->
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#f0f0f0"/>
          <rect x="40" y="100" width="134" height="12" rx="6" fill="#FF8B2C"/>
          <text x="375" y="90" text-anchor="middle" class="progress-text">1/5</text>
          
          <text x="375" y="200" text-anchor="middle" class="question">1. 你更倾向于哪种学习方式？</text>
          
          <!-- 选项 -->
          <g id="q1-option1">
            <rect x="75" y="280" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="327" text-anchor="middle" class="option">A. 先理解语法规则，再练习应用</text>
            <!-- 点击区域 -->
            <rect x="75" y="280" width="600" height="70" rx="35" fill="transparent" 
                  onclick="selectOption(1, 1)" style="cursor: pointer;"/>
          </g>
          
          <g id="q1-option2">
            <rect x="75" y="380" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="427" text-anchor="middle" class="option">B. 先大量输入，自然形成语感</text>
            <!-- 点击区域 -->
            <rect x="75" y="380" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(1, 2)" style="cursor: pointer;"/>
          </g>
          
          <g id="q1-option3">
            <rect x="75" y="480" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="527" text-anchor="middle" class="option">C. 通过游戏化方式学习，轻松有趣</text>
            <!-- 点击区域 -->
            <rect x="75" y="480" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(1, 3)" style="cursor: pointer;"/>
          </g>
          
          <!-- 下一题按钮 -->
          <rect id="next-btn-1" x="275" y="600" width="200" height="70" rx="35" class="next-btn"/>
          <text x="375" y="647" text-anchor="middle" class="button">下一题</text>
          
          <!-- 点击区域 -->
          <rect x="275" y="600" width="200" height="70" rx="35" fill="transparent" 
                onclick="nextQuestion(2)" style="cursor: pointer;"/>
        </g>
        
        <!-- 问题2 -->
        <g id="page-2" style="display: none;">
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#f0f0f0"/>
          <rect x="40" y="100" width="268" height="12" rx="6" fill="#FF8B2C"/>
          <text x="375" y="90" text-anchor="middle" class="progress-text">2/5</text>
          
          <text x="375" y="200" text-anchor="middle" class="question">2. 你学习英语的主要目的是？</text>
          
          <g id="q2-option1">
            <rect x="75" y="280" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="327" text-anchor="middle" class="option">A. 通过考试（四六级、雅思、托福等）</text>
            <rect x="75" y="280" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(2, 1)" style="cursor: pointer;"/>
          </g>
          
          <g id="q2-option2">
            <rect x="75" y="380" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="427" text-anchor="middle" class="option">B. 日常交流和旅行</text>
            <rect x="75" y="380" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(2, 2)" style="cursor: pointer;"/>
          </g>
          
          <g id="q2-option3">
            <rect x="75" y="480" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="527" text-anchor="middle" class="option">C. 职业发展和商务沟通</text>
            <rect x="75" y="480" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(2, 3)" style="cursor: pointer;"/>
          </g>
          
          <rect id="next-btn-2" x="275" y="600" width="200" height="70" rx="35" class="next-btn"/>
          <text x="375" y="647" text-anchor="middle" class="button">下一题</text>
          
          <rect x="275" y="600" width="200" height="70" rx="35" fill="transparent"
                onclick="nextQuestion(3)" style="cursor: pointer;"/>
        </g>
        
        <!-- 问题3 -->
        <g id="page-3" style="display: none;">
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#f0f0f0"/>
          <rect x="40" y="100" width="402" height="12" rx="6" fill="#FF8B2C"/>
          <text x="375" y="90" text-anchor="middle" class="progress-text">3/5</text>
          
          <text x="375" y="200" text-anchor="middle" class="question">3. 你更擅长哪种记忆方式？</text>
          
          <g id="q3-option1">
            <rect x="75" y="280" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="327" text-anchor="middle" class="option">A. 逻辑记忆（通过关联和理解）</text>
            <rect x="75" y="280" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(3, 1)" style="cursor: pointer;"/>
          </g>
          
          <g id="q3-option2">
            <rect x="75" y="380" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="427" text-anchor="middle" class="option">B. 图像记忆（通过画面和场景）</text>
            <rect x="75" y="380" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(3, 2)" style="cursor: pointer;"/>
          </g>
          
          <g id="q3-option3">
            <rect x="75" y="480" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="527" text-anchor="middle" class="option">C. 重复记忆（通过反复练习）</text>
            <rect x="75" y="480" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(3, 3)" style="cursor: pointer;"/>
          </g>
          
          <rect id="next-btn-3" x="275" y="600" width="200" height="70" rx="35" class="next-btn"/>
          <text x="375" y="647" text-anchor="middle" class="button">下一题</text>
          
          <rect x="275" y="600" width="200" height="70" rx="35" fill="transparent"
                onclick="nextQuestion(4)" style="cursor: pointer;"/>
        </g>
        
        <!-- 问题4 -->
        <g id="page-4" style="display: none;">
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#f0f0f0"/>
          <rect x="40" y="100" width="536" height="12" rx="6" fill="#FF8B2C"/>
          <text x="375" y="90" text-anchor="middle" class="progress-text">4/5</text>
          
          <text x="375" y="200" text-anchor="middle" class="question">4. 你在学习英语时最大的挑战是？</text>
          
          <g id="q4-option1">
            <rect x="75" y="280" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="327" text-anchor="middle" class="option">A. 语法规则复杂难以理解</text>
            <rect x="75" y="280" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(4, 1)" style="cursor: pointer;"/>
          </g>
          
          <g id="q4-option2">
            <rect x="75" y="380" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="427" text-anchor="middle" class="option">B. 词汇量不足，容易遗忘</text>
            <rect x="75" y="380" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(4, 2)" style="cursor: pointer;"/>
          </g>
          
          <g id="q4-option3">
            <rect x="75" y="480" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="527" text-anchor="middle" class="option">C. 口语表达不流利，缺乏自信</text>
            <rect x="75" y="480" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(4, 3)" style="cursor: pointer;"/>
          </g>
          
          <rect id="next-btn-4" x="275" y="600" width="200" height="70" rx="35" class="next-btn"/>
          <text x="375" y="647" text-anchor="middle" class="button">下一题</text>
          
          <rect x="275" y="600" width="200" height="70" rx="35" fill="transparent"
                onclick="nextQuestion(5)" style="cursor: pointer;"/>
        </g>
        
        <!-- 问题5 -->
        <g id="page-5" style="display: none;">
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#f0f0f0"/>
          <rect x="40" y="100" width="670" height="12" rx="6" fill="#FF8B2C"/>
          <text x="375" y="90" text-anchor="middle" class="progress-text">5/5</text>
          
          <text x="375" y="200" text-anchor="middle" class="question">5. 你更看重学习的哪个方面？</text>
          
          <g id="q5-option1">
            <rect x="75" y="280" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="327" text-anchor="middle" class="option">A. 准确性和正确性</text>
            <rect x="75" y="280" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(5, 1)" style="cursor: pointer;"/>
          </g>
          
          <g id="q5-option2">
            <rect x="75" y="380" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="427" text-anchor="middle" class="option">B. 流利性和实用性</text>
            <rect x="75" y="380" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(5, 2)" style="cursor: pointer;"/>
          </g>
          
          <g id="q5-option3">
            <rect x="75" y="480" width="600" height="70" rx="35" class="option-rect"/>
            <text x="375" y="527" text-anchor="middle" class="option">C. 深度和文化理解</text>
            <rect x="75" y="480" width="600" height="70" rx="35" fill="transparent"
                  onclick="selectOption(5, 3)" style="cursor: pointer;"/>
          </g>
          
          <!-- 查看结果按钮 -->
          <rect id="result-btn" x="175" y="600" width="400" height="80" rx="40" class="next-btn"/>
          <text x="375" y="652" text-anchor="middle" class="button">查看结果</text>
          
          <!-- 点击区域 -->
          <rect x="175" y="600" width="400" height="80" rx="40" fill="transparent"
                onclick="showResult()" style="cursor: pointer;"/>
        </g>
        
        <!-- 结果页 -->
        <g id="page-result" style="display: none;">
          <text x="375" y="200" text-anchor="middle" class="result-title">你的学习类型</text>
          
          <!-- 结果内容 -->
          <rect x="75" y="300" width="600" height="400" rx="20" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
          
          <text id="result-type" x="375" y="380" text-anchor="middle" class="result-title" font-size="40">逻辑型学习者</text>
          <text id="result-subtitle" x="375" y="440" text-anchor="middle" class="subtitle">擅长通过理解规则和结构来学习</text>
          
          <text x="100" y="520" class="result-desc">• 系统学习语法规则</text>
          <text x="100" y="570" class="result-desc">• 构建知识体系框架</text>
          <text x="100" y="620" class="result-desc">• 进行有针对性的练习</text>
          <text x="100" y="670" class="result-desc">• 定期总结和复习</text>
          
          <text id="result-resource" x="375" y="750" text-anchor="middle" class="subtitle">推荐学习资源：《剑桥语法》、《新概念英语》</text>
          
          <!-- 重新测试按钮 -->
          <rect x="175" y="850" width="400" height="80" rx="40" fill="#FF8B2C" style="cursor: pointer;">
            <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
          </rect>
          <text x="375" y="902" text-anchor="middle" class="button">重新测试</text>
          
          <!-- 点击区域 -->
          <rect x="175" y="850" width="400" height="80" rx="40" fill="transparent" 
                onclick="restartTest()" style="cursor: pointer;"/>
        </g>
        
        <!-- 底部信息 -->
        <text x="375" y="1100" text-anchor="middle" class="subtitle" font-size="24">本测试基于《最强大脑》学习方法论</text>
        <text x="375" y="1150" text-anchor="middle" class="subtitle" font-size="20">结果仅供参考，选择最适合你的学习方式</text>
        <text x="375" y="1200" text-anchor="middle" class="subtitle" font-size="18">原创：徐徐道来亲子笔记</text>
      </svg>
    </div>
  </div>

  <div class="tip">
    💡 使用方法：点击下方"复制代码"按钮，然后粘贴到微信公众号编辑器的HTML模式中
  </div>
  
  <button class="copy-btn" onclick="copyTestContent()">📋 复制代码到剪贴板</button>
  
  <div class="toast" id="toast">✅ 已复制！请到微信公众号编辑器粘贴</div>

  <script>
    // 复制函数
    function copyTestContent() {
      // 获取测试内容
      const testContent = document.getElementById('testContent').innerHTML;
      
      // 创建完整的HTML文档
      const fullHTML = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习类型测试</title>
    <style>
      body { margin: 0; padding: 0; background: #f5f7fa; font-family: 'PingFang SC', sans-serif; }
      svg { display: block; width: 100%; height: auto; }
      [style*="cursor: pointer"] { cursor: pointer; }
      .option-rect-selected { fill: #FF8B2C !important; stroke: #FF8B2C !important; }
      .option-selected { fill: #ffffff !important; }
      .next-btn-active { fill: #FF8B2C !important; }
    </style>
    <script>
      // 确保所有函数都在全局作用域
      function showPage(pageId) {
        // 隐藏所有页面
        var pages = ['page-cover', 'page-1', 'page-2', 'page-3', 'page-4', 'page-5', 'page-result'];
        for(var i = 0; i < pages.length; i++) {
          var el = document.getElementById(pages[i]);
          if(el) el.style.display = 'none';
        }
        
        // 显示目标页面
        var target = document.getElementById(pageId);
        if(target) target.style.display = 'block';
      }
      
      function selectOption(questionNum, optionNum) {
        // 保存答案到全局变量
        if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
        window.userAnswers[questionNum-1] = optionNum;
        
        // 清除该问题的所有选项选中状态
        for(var i = 1; i <= 3; i++) {
          var rect = document.querySelector('#q' + questionNum + '-option' + i + ' rect:first-of-type');
          var text = document.querySelector('#q' + questionNum + '-option' + i + ' text');
          
          if(rect) {
            rect.classList.remove('option-rect-selected');
            rect.classList.add('option-rect');
          }
          if(text) text.classList.remove('option-selected');
        }
        
        // 设置当前选项为选中状态
        var selectedRect = document.querySelector('#q' + questionNum + '-option' + optionNum + ' rect:first-of-type');
        var selectedText = document.querySelector('#q' + questionNum + '-option' + optionNum + ' text');
        
        if(selectedRect) {
          selectedRect.classList.remove('option-rect');
          selectedRect.classList.add('option-rect-selected');
        }
        if(selectedText) selectedText.classList.add('option-selected');
        
        // 激活下一题按钮
        if(questionNum < 5) {
          var nextBtn = document.getElementById('next-btn-' + questionNum);
          if(nextBtn) {
            nextBtn.classList.remove('next-btn');
            nextBtn.classList.add('next-btn-active');
          }
        } else {
          // 第5题，激活查看结果按钮
          var resultBtn = document.getElementById('result-btn');
          if(resultBtn) {
            resultBtn.classList.remove('next-btn');
            resultBtn.classList.add('next-btn-active');
          }
        }
      }
      
      function nextQuestion(nextPageNum) {
        // 检查当前问题是否已回答
        if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
        var currentPage = nextPageNum - 1;
        
        if(window.userAnswers[currentPage-1] === 0) {
          alert('请先选择一个选项！');
          return;
        }
        
        showPage('page-' + nextPageNum);
      }
      
      function showResult() {
        // 检查第5题是否已回答
        if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
        if(window.userAnswers[4] === 0) {
          alert('请先选择一个选项！');
          return;
        }
        
        // 计算结果类型
        calculateResult();
        showPage('page-result');
      }
      
      function calculateResult() {
        if(!window.userAnswers) window.userAnswers = [0, 0, 0, 0, 0];
        
        // 统计各选项数量
        var typeACount = 0;
        var typeBCount = 0;
        var typeCCount = 0;
        
        for(var i = 0; i < 5; i++) {
          var answer = window.userAnswers[i];
          if(answer === 1) typeACount++;
          else if(answer === 2) typeBCount++;
          else if(answer === 3) typeCCount++;
        }
        
        // 确定类型
        var resultType = "逻辑型学习者";
        var resultSubtitle = "擅长通过理解规则和结构来学习";
        var resultResource = "推荐学习资源：《剑桥语法》、《新概念英语》";
        
        if(typeBCount > typeACount && typeBCount > typeCCount) {
          resultType = "直觉型学习者";
          resultSubtitle = "擅长通过语感和直觉来学习";
          resultResource = "推荐学习资源：TED演讲、英文电影、有声书";
        } else if(typeCCount > typeACount && typeCCount > typeBCount) {
          resultType = "实践型学习者";
          resultSubtitle = "擅长通过实际应用来学习";
          resultResource = "推荐学习资源：语言交换平台、口语课程";
        }
        
        // 更新结果页
        var resultTypeEl = document.getElementById('result-type');
        var resultSubtitleEl = document.getElementById('result-subtitle');
        var resultResourceEl = document.getElementById('result-resource');
        
        if(resultTypeEl) resultTypeEl.textContent = resultType;
        if(resultSubtitleEl) resultSubtitleEl.textContent = resultSubtitle;
        if(resultResourceEl) resultResourceEl.textContent = resultResource;
      }
      
      function restartTest() {
        // 重置答案
        window.userAnswers = [0, 0, 0, 0, 0];
        
        // 重置所有选项状态
        for(var q = 1; q <= 5; q++) {
          for(var o = 1; o <= 3; o++) {
            var rect = document.querySelector('#q' + q + '-option' + o + ' rect:first-of-type');
            var text = document.querySelector('#q' + q + '-option' + o + ' text');
            
            if(rect) {
              rect.classList.remove('option-rect-selected');
              rect.classList.add('option-rect');
            }
            if(text) text.classList.remove('option-selected');
          }
        }
        
        // 重置所有按钮
        for(var i = 1; i <= 4; i++) {
          var btn = document.getElementById('next-btn-' + i);
          if(btn) {
            btn.classList.remove('next-btn-active');
            btn.classList.add('next-btn');
          }
        }
        
        var resultBtn = document.getElementById('result-btn');
        if(resultBtn) {
          resultBtn.classList.remove('next-btn-active');
          resultBtn.classList.add('next-btn');
        }
        
        // 回到封面
        showPage('page-cover');
      }
      
      // 页面加载完成后初始化
      window.onload = function() {
        showPage('page-cover');
      };
    <\/script>
</head>
<body>
${testContent}
</body>
</html>`;
      
      // 创建文本区域来复制
      const textArea = document.createElement('textarea');
      textArea.value = fullHTML;
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        // 使用现代API尝试复制
        const blob = new Blob([fullHTML], { type: 'text/html' });
        const clipboardItem = new ClipboardItem({ 'text/html': blob });
        
        navigator.clipboard.write([clipboardItem]).then(() => {
          showToast();
        }).catch(err => {
          // 降级方案
          document.execCommand('copy');
          showToast();
        });
      } catch (err) {
        // 降级方案
        document.execCommand('copy');
        showToast();
      }
      
      document.body.removeChild(textArea);
    }
    
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
